<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企劃卡總覽</title>
<style>
  :root {
    --bg1: #070b1f; --bg2: #1b1446;
    --paper: #fffdf8; --ink: #1c2140; --ink2: #5b6280; --line: #d9dce8; --soft: #f3f4f9;
    --cyan: #0891b2; --gold: #d97706; --pink: #db2777; --lime: #65a30d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; color: var(--ink);
    background: #eceef5;
    background-image: radial-gradient(rgba(28,33,64,.07) 1px, transparent 1px); background-size: 22px 22px; padding: 20px 16px 30px; }
  .emo { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; color: var(--ink); }
  h1 { font-size: 26px; letter-spacing: 2px; }
  #st { color: var(--ink2); font-size: 14px; }
  #st button { font: inherit; margin-left: 8px; padding: 4px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; align-items: start; }
  .c { background: var(--paper); border-radius: 14px; overflow: hidden; font-size: 14px; line-height: 1.55;
    box-shadow: 0 8px 24px rgba(28,33,64,.12), 0 0 0 1px rgba(28,33,64,.06); }
  .c::before { content: ""; display: block; height: 6px; background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); }
  .c.empty { background: transparent; box-shadow: none; border: 2px dashed #b9bdd0; color: var(--ink2); }
  .c.empty::before { display: none; }
  .c h2 { font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 14px 8px; border-bottom: 2px solid var(--ink); }
  .c.empty h2 { border-bottom: none; }
  .c h2 small { font-size: 12px; color: var(--ink2); font-weight: 400; }
  .c .nm { font-size: 17px; font-weight: 900; padding: 8px 14px 4px; }
  .c .r { padding: 6px 14px 6px 12px; border-left: 4px solid var(--k); margin: 4px 0; }
  .c .r b { color: var(--k); margin-right: 4px; }
  .c .r:last-child { margin-bottom: 10px; }
  .c .wait { padding: 4px 14px 14px; }
</style>
</head>
<body>
<header>
  <h1><span class="emo">🃏</span>各組企劃卡</h1>
  <div id="st">讀取中…</div>
</header>
<div class="grid" id="grid"></div>
<script>
// 跟 index.html 用同一個 GAS 網址
const API_URL = 'https://script.google.com/macros/s/AKfycbyz2bGo1myBTq4jE3CLFaafu-Jc99gLY47gG_7wJGwsjtJtlalXYQ-YQpllfKmX5__H/exec';
const ROWS = [['who', '🎯 給誰用', 'var(--cyan)'], ['when', '⏰ 什麼時候用', 'var(--gold)'], ['problem', '🧩 解決什麼問題', 'var(--pink)'], ['feature', '⭐ 特色', 'var(--lime)']];
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render(cards) {
  const by = {}; cards.forEach(c => by[c.group] = c);
  let h = '';
  for (let g = 1; g <= 10; g++) {
    const c = by[g];
    h += `<div class="c${c ? '' : ' empty'}"><h2>第 ${g} 組${c ? `<small>${esc(c.updated)} 存</small>` : ''}</h2>`;
    if (!c) { h += '<div class="wait">還沒填</div></div>'; continue; }
    h += `<div class="nm">${esc(c.name) || '（未命名）'}</div>`;
    ROWS.forEach(([k, l, col]) => h += `<div class="r" style="--k:${col}"><b>${l}</b>${esc(c[k]) || '<span style="color:var(--ink2)">—</span>'}</div>`);
    h += '</div>';
  }
  document.getElementById('grid').innerHTML = h;
}

async function load() {
  const st = document.getElementById('st');
  if (!API_URL) { st.textContent = '尚未設定 GAS 網址'; render([]); return; }
  try {
    const r = await (await fetch(API_URL + '?action=list')).json();
    if (!r.ok) throw new Error(r.error);
    render(r.cards);
    st.innerHTML = `已填 ${r.cards.length} / 10 組　${new Date().toTimeString().slice(0, 5)} 更新<button onclick="load()">重新整理</button>`;
  } catch (e) { st.innerHTML = '讀取失敗<button onclick="load()">重試</button>'; }
}
load();
setInterval(load, 20000);
</script>
</body>
</html>
