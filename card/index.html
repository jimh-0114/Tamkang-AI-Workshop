<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>產品企劃卡</title>
<style>
  :root {
    --paper: #fffdf8; --ink: #1c2140; --ink2: #5b6280; --line: #dfe2ec; --soft: #f4f5fa;
    --cyan: #0891b2; --gold: #d97706; --pink: #db2777; --lime: #65a30d; --violet: #7c3aed; --red: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; color: var(--ink); font-size: 18px;
    background: #eceef5; background-image: radial-gradient(rgba(28,33,64,.07) 1px, transparent 1px); background-size: 22px 22px;
    padding: 40px 16px 60px; }
  .emo { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
  /* 選組頁：整張卡在畫面正中間 */
  body.pick { display: flex; align-items: center; justify-content: center; padding-top: 16px; padding-bottom: 16px; }
  body.pick .paper { width: 100%; }
  /* 白色紙卡 */
  .paper { max-width: 960px; margin: 0 auto; background: var(--paper); border-radius: 20px; overflow: hidden;
    box-shadow: 0 14px 40px rgba(28,33,64,.14), 0 0 0 1px rgba(28,33,64,.06); }
  .paper::before { content: ""; display: block; height: 10px; background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 40px 22px; border-bottom: 2px solid var(--ink); }
  .head h1 { font-size: 34px; letter-spacing: 3px; display: flex; align-items: center; gap: 12px; }
  .gtag { font-size: 22px; font-weight: 900; padding: 6px 20px; border-radius: 10px; border: 2px solid var(--ink); white-space: nowrap; }
  .body { padding: 30px 40px 40px; }
  .lead { font-size: 24px; font-weight: 800; }
  /* 選組 */
  .groups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 22px; }
  @media (min-width: 640px) { .groups { grid-template-columns: repeat(5, 1fr); } }
  .groups button { font: inherit; font-size: 26px; font-weight: 900; border-radius: 14px; cursor: pointer;
    border: 2px solid var(--line); background: #fff; color: var(--ink); transition: border-color .15s, transform .15s, box-shadow .15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 120px; }
  .groups button:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(28,33,64,.12); }
  .groups button .st { font-size: 15px; font-weight: 700; color: var(--lime); }
  .groups button .st:empty { display: none; }
  /* 產品名稱 */
  .namerow { display: flex; align-items: baseline; gap: 14px; padding: 6px 0 28px; }
  .namerow label { font-size: 24px; font-weight: 900; white-space: nowrap; }
  .namerow input { flex: 1; min-width: 0; font: inherit; font-size: 26px; font-weight: 800; color: var(--ink); background: transparent;
    border: none; border-bottom: 2px dashed var(--ink2); padding: 4px 2px; }
  .namerow input:focus { outline: none; border-bottom: 2px solid var(--violet); }
  /* 四格：每格標題在上、填寫區在下 */
  .grid { display: grid; gap: 18px; }
  .row { border: 2px solid var(--line); border-left: 8px solid var(--c); border-radius: 14px; overflow: hidden; background: #fff; }
  .row:focus-within { border-color: var(--c); }
  .k { padding: 14px 20px 12px; background: var(--soft); display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
  .k b { display: flex; align-items: center; gap: 8px; font-size: 24px; color: var(--c); white-space: nowrap; }
  .k small { font-size: 16px; color: var(--ink2); line-height: 1.5; }
  .row textarea { display: block; width: 100%; min-height: 110px; font: inherit; font-size: 20px; line-height: 1.7; color: var(--ink); background: #fff;
    border: none; padding: 16px 20px; resize: vertical; }
  .row textarea:focus { outline: none; }
  /* 按鈕與訊息 */
  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 28px; }
  .btn { font: inherit; font-size: 22px; font-weight: 900; padding: 14px 40px; border-radius: 12px; cursor: pointer; border: 2px solid var(--ink);
    background: var(--ink); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: #fff; color: var(--ink); }
  .btn.done { background: var(--lime); border-color: var(--lime); color: #fff; }
  .back { font: inherit; font-size: 17px; color: var(--ink2); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 7px 16px; cursor: pointer; }
  .back:hover { border-color: var(--ink2); }
  .msg { font-size: 17px; color: var(--ink2); }
  .msg.err { color: var(--red); }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  /* 完成頁 */
  .dv { font-size: 26px; font-weight: 800; border-bottom: 2px solid var(--ink); padding: 2px 4px; }
  .v { padding: 16px 20px; font-size: 20px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; }
  .v:empty::before { content: "（沒填）"; color: var(--ink2); }
  @media (max-width: 560px) {
    body { padding: 20px 12px 40px; }
    .head { padding: 20px 20px 16px; } .head h1 { font-size: 26px; } .body { padding: 22px 20px 28px; }
    .namerow { flex-direction: column; gap: 6px; } .groups button { min-height: 90px; font-size: 22px; }
  }
</style>
</head>
<body class="pick">
<div class="paper" id="step1">
  <div class="head"><h1><span class="emo">🃏</span>產品企劃卡</h1></div>
  <div class="body">
    <p class="lead">你們是第幾組？</p>
    <div class="groups" id="groups"></div>
  </div>
</div>

<div class="paper" id="form" hidden>
  <div class="head">
    <h1><span class="emo">🃏</span>產品企劃卡</h1>
    <span class="gtag" id="gtag"></span>
  </div>
  <div class="body">
    <div class="top"><button class="back" id="back">← 換組</button><span class="msg" id="lmsg"></span></div>
    <div class="namerow">
      <label for="name">產品名稱：</label>
      <input id="name" maxlength="60" placeholder="例如：抽組選號器">
    </div>
    <div class="grid">
      <div class="row" style="--c:var(--cyan)">
        <div class="k"><b><span class="emo">🎯</span>給誰用</b><small>誰會打開這個工具？（老師、學員、課程助教……）</small></div>
        <textarea id="who"></textarea>
      </div>
      <div class="row" style="--c:var(--gold)">
        <div class="k"><b><span class="emo">⏰</span>什麼時候用</b><small>在什麼情況、哪個時間點會用到？（備課時、上完課、期末……）</small></div>
        <textarea id="when"></textarea>
      </div>
      <div class="row" style="--c:var(--pink)">
        <div class="k"><b><span class="emo">🧩</span>解決什麼問題</b><small>使用者現在怎麼做？哪裡花時間、容易出錯？用了之後可以改善什麼？</small></div>
        <textarea id="problem"></textarea>
      </div>
      <div class="row" style="--c:var(--lime)">
        <div class="k"><b><span class="emo">⭐</span>特色</b><small>有什麼是別人沒有、我們有的？</small></div>
        <textarea id="feature"></textarea>
      </div>
    </div>

    <div class="bar">
      <button class="btn" id="save">💾 儲存</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>
</div>

<div class="paper" id="done" hidden>
  <div class="head">
    <h1><span class="emo">✅</span>企劃卡完成</h1>
    <span class="gtag" id="dtag"></span>
  </div>
  <div class="body">
    <div class="namerow"><label>產品名稱：</label><span class="dv" id="d_name"></span></div>
    <div class="grid">
      <div class="row" style="--c:var(--cyan)"><div class="k"><b><span class="emo">🎯</span>給誰用</b></div><div class="v" id="d_who"></div></div>
      <div class="row" style="--c:var(--gold)"><div class="k"><b><span class="emo">⏰</span>什麼時候用</b></div><div class="v" id="d_when"></div></div>
      <div class="row" style="--c:var(--pink)"><div class="k"><b><span class="emo">🧩</span>解決什麼問題</b></div><div class="v" id="d_problem"></div></div>
      <div class="row" style="--c:var(--lime)"><div class="k"><b><span class="emo">⭐</span>特色</b></div><div class="v" id="d_feature"></div></div>
    </div>
    <div class="bar">
      <button class="btn" id="copy">📋 複製企劃卡</button>
      <button class="btn ghost" id="edit">✏️ 修改</button>
      <span class="msg" id="dmsg"></span>
    </div>
  </div>
</div>

<script>
// 部署 GAS 後，把網址貼在這裡
const API_URL = 'https://script.google.com/macros/s/AKfycbyz2bGo1myBTq4jE3CLFaafu-Jc99gLY47gG_7wJGwsjtJtlalXYQ-YQpllfKmX5__H/exec';

const FIELDS = ['name', 'who', 'when', 'problem', 'feature'];
const $ = id => document.getElementById(id);
let group = 0;

function draftKey(g) { return 'tamkang-card-' + g; }
function readForm() { const d = { group }; FIELDS.forEach(k => d[k] = $(k).value.trim()); return d; }
function fillForm(d) { FIELDS.forEach(k => $(k).value = (d && d[k]) || ''); }
function saveDraft() { try { localStorage.setItem(draftKey(group), JSON.stringify(readForm())); } catch (e) {} }
function loadDraft(g) { try { return JSON.parse(localStorage.getItem(draftKey(g)) || 'null'); } catch (e) { return null; } }
function cardText(d) {
  return `產品名稱：${d.name}
給誰用：${d.who}
什麼時候用：${d.when}
解決什麼問題：${d.problem}
特色：${d.feature}`;
}
function view(id) { ['step1', 'form', 'done'].forEach(v => $(v).hidden = v !== id); document.body.classList.toggle('pick', id === 'step1'); window.scrollTo(0, 0); }
let doneCard = null;
function showResult(d) {
  doneCard = d;
  $('dtag').textContent = '第 ' + group + ' 組';
  FIELDS.forEach(k => $('d_' + k).textContent = d[k] || '');
  $('dmsg').textContent = d.updated ? '已存到雲端（' + d.updated + '）' : '';
  view('done');
}
function copyCard() {
  const t = cardText(doneCard);
  const ok = () => { $('copy').textContent = '✅ 已複製'; $('copy').classList.add('done');
    setTimeout(() => { $('copy').textContent = '📋 複製企劃卡'; $('copy').classList.remove('done'); }, 1800); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, () => fallback(t, ok));
  else fallback(t, ok);
}
function fallback(t, ok) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); ok(); }
function loadMsg(t, err) { $('lmsg').textContent = t; $('lmsg').className = 'msg' + (err ? ' err' : ''); }
function setMsg(t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }

// 選組頁一打開就抓 10 組的資料，點組別時直接帶出，不用再等雲端
let cache = null;          // { 組別: 企劃卡 }
let cacheReq = null;
function fetchAll() {
  if (!API_URL) return Promise.resolve(null);
  cacheReq = fetch(API_URL + '?action=list').then(r => r.json()).then(r => {
    cache = {}; (r.cards || []).forEach(c => cache[c.group] = c); markGroups(); return cache;
  }).catch(() => null);
  return cacheReq;
}
function markGroups() {
  document.querySelectorAll('#groups button').forEach(b => b.querySelector('.st').textContent = cache && cache[+b.dataset.g] ? '✓ 已填' : '');
}

async function pickGroup(g) {
  group = g;
  view('form'); $('gtag').textContent = '第 ' + g + ' 組';
  setMsg(''); loadMsg('');
  if (!cache && API_URL) {
    loadMsg('連線中，請稍等…'); $('save').disabled = true;
    await (cacheReq || fetchAll());
    if (group !== g) return;
    $('save').disabled = false;
  }
  const c = cache && cache[g];
  if (c) { fillForm(c); saveDraft(); loadMsg('已帶出第 ' + g + ' 組 ' + c.updated + ' 存的內容'); }
  else { fillForm(loadDraft(g)); loadMsg(cache || !API_URL ? '' : '連不上雲端，先存在這台電腦，等一下再按儲存', !cache && !!API_URL); }
}

async function save() {
  const d = readForm();
  saveDraft();
  if (!API_URL) { setMsg('已存在這台裝置（尚未連上雲端）'); showResult(d); return; }
  $('save').disabled = true; setMsg('儲存中…');
  try {
    const r = await (await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) })).json();
    if (r.ok) { if (cache) { cache[r.card.group] = r.card; markGroups(); } setMsg(''); showResult(r.card); } else setMsg('儲存失敗：' + r.error, true);
  } catch (e) { setMsg('儲存失敗，請再按一次', true); }
  $('save').disabled = false;
}

for (let g = 1; g <= 10; g++) {
  const b = document.createElement('button'); b.innerHTML = '第 ' + g + ' 組<span class="st"></span>'; b.dataset.g = g; b.onclick = () => pickGroup(g); $('groups').appendChild(b);
}
fetchAll();
FIELDS.forEach(k => $(k).addEventListener('input', saveDraft));
$('save').onclick = save;
$('copy').onclick = copyCard;
$('back').onclick = () => { group = 0; view('step1'); fetchAll(); };
$('edit').onclick = () => { view('form'); setMsg(''); };
</script>
</body>
</html>
