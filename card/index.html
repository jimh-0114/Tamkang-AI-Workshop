<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>產品企劃卡</title>
<style>
  :root {
    --bg1: #070b1f; --bg2: #1b1446; --card: rgba(19,26,58,.88); --txt: #f8fafc; --sub: #c7d2fe; --dim: #8b93c9;
    --cyan: #22d3ee; --pink: #f472b6; --gold: #fbbf24; --lime: #a3e635; --violet: #a78bfa; --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; color: var(--txt);
    background: radial-gradient(circle at 90% 0%, rgba(34,211,238,.16), transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(244,114,182,.14), transparent 40%),
                linear-gradient(135deg, var(--bg1), var(--bg2)) fixed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 60px; }
  .emo { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
  h1 { font-size: 28px; display: flex; align-items: center; gap: 10px; }
  .lead { color: var(--sub); margin-top: 6px; font-size: 15px; }
  .sec { margin-top: 22px; }
  .lab { font-size: 18px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .groups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 22px; }
  @media (min-width: 560px) { .groups { grid-template-columns: repeat(5, 1fr); } }
  .groups button { font: inherit; font-size: 22px; font-weight: 900; padding: 20px 0; border-radius: 16px; cursor: pointer;
    border: 2px solid #3b4380; background: var(--card); color: var(--txt); transition: transform .15s, border-color .15s; }
  .groups button:hover { border-color: var(--cyan); transform: translateY(-2px); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gtag { font-size: 18px; font-weight: 900; padding: 6px 18px; border-radius: 999px; color: #070b1f;
    background: linear-gradient(90deg, var(--cyan), var(--pink)); white-space: nowrap; }
  .back { font: inherit; font-size: 15px; color: var(--sub); background: none; border: 1px solid #3b4380; border-radius: 999px;
    padding: 6px 14px; cursor: pointer; }
  .field { margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 2px solid var(--c, #3b4380); }
  .field .lab { color: var(--c, var(--txt)); }
  .hint { font-size: 14px; color: var(--dim); margin: -2px 0 8px; line-height: 1.5; }
  input, textarea { width: 100%; font: inherit; font-size: 17px; color: var(--txt); background: rgba(7,11,31,.7);
    border: 1px solid #3b4380; border-radius: 10px; padding: 10px 12px; line-height: 1.6; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--c, var(--cyan)); border-color: transparent; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 18px; font-weight: 900; padding: 12px 30px; border-radius: 999px; cursor: pointer; border: none;
    background: linear-gradient(90deg, var(--lime), var(--cyan)); color: #070b1f; }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 15px; color: var(--sub); }
  .msg.err { color: var(--red); }
  .btn.ghost { background: rgba(251,191,36,.15); color: var(--gold); border: 2px solid var(--gold); }
  .btn.done { background: var(--lime); color: #070b1f; border-color: var(--lime); }
  .result { margin-top: 22px; padding: 16px 18px; border-radius: 16px; background: rgba(15,20,50,.75); border: 2px solid var(--lime);
    box-shadow: 0 0 20px rgba(163,230,53,.25); }
  .result pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 16px; line-height: 1.75; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="step1">
    <h1><span class="emo">🃏</span>產品企劃卡</h1>
    <p class="lead">你們是第幾組？</p>
    <div class="groups" id="groups"></div>
  </div>

  <div id="form" hidden>
    <div class="top">
      <h1><span class="emo">🃏</span>產品企劃卡</h1>
      <span class="gtag" id="gtag"></span>
    </div>
    <div class="bar" style="margin-top:8px"><button class="back" id="back">← 換組</button><span class="msg" id="lmsg"></span></div>
    <div class="field" style="--c:var(--violet)">
      <div class="lab"><span class="emo">🏷️</span>產品名稱</div>
      <input id="name" maxlength="60" placeholder="例如：抽組選號器">
    </div>
    <div class="field" style="--c:var(--cyan)">
      <div class="lab"><span class="emo">🎯</span>給誰用</div>
      <div class="hint">誰會打開這個工具？（老師、學員、課程助教……）</div>
      <textarea id="who"></textarea>
    </div>
    <div class="field" style="--c:var(--gold)">
      <div class="lab"><span class="emo">⏰</span>什麼時候用</div>
      <div class="hint">在什麼情況、哪個時間點會用到？（備課時、上完課、期末……）</div>
      <textarea id="when"></textarea>
    </div>
    <div class="field" style="--c:var(--pink)">
      <div class="lab"><span class="emo">🧩</span>解決什麼問題</div>
      <div class="hint">使用者現在怎麼做？哪裡花時間、容易出錯？用了這個工具後，可以改善什麼？</div>
      <textarea id="problem"></textarea>
    </div>
    <div class="field" style="--c:var(--lime)">
      <div class="lab"><span class="emo">⭐</span>有什麼特色</div>
      <div class="hint">有什麼是別人沒有、我們有的？</div>
      <textarea id="feature"></textarea>
    </div>

    <div class="bar">
      <button class="btn" id="save">💾 儲存</button>
      <span class="msg" id="msg"></span>
    </div>

    <div class="result" id="result" hidden>
      <div class="lab"><span class="emo">✅</span>我們的產品企劃卡</div>
      <pre id="full"></pre>
      <div class="bar"><button class="btn ghost" id="copy">📋 複製企劃卡</button></div>
    </div>
  </div>
</div>

<script>
// 部署 GAS 後，把網址貼在這裡
const API_URL = 'https://script.google.com/macros/s/AKfycbyz2bGo1myBTq4jE3CLFaafu-Jc99gLY47gG_7wJGwsjtJtlalXYQ-YQpllfKmX5__H/exec';

const FIELDS = ['name', 'who', 'when', 'problem', 'feature'];
const $ = id => document.getElementById(id);
let group = 0;

function draftKey(g) { return 'tamkang-card-' + g; }
function readForm() { const d = { group }; FIELDS.forEach(k => d[k] = $(k).value.trim()); return d; }
function fillForm(d) { FIELDS.forEach(k => $(k).value = (d && d[k]) || ''); $('result').hidden = true; }
function saveDraft() { try { localStorage.setItem(draftKey(group), JSON.stringify(readForm())); } catch (e) {} }
function loadDraft(g) { try { return JSON.parse(localStorage.getItem(draftKey(g)) || 'null'); } catch (e) { return null; } }
function cardText(d) {
  return `產品名稱：${d.name}
給誰用：${d.who}
什麼時候用：${d.when}
解決什麼問題：${d.problem}
特色：${d.feature}`;
}
function showResult(d) { $('full').textContent = cardText(d); $('result').hidden = false; }
function copyCard() {
  const t = $('full').textContent;
  const ok = () => { $('copy').textContent = '✅ 已複製'; $('copy').classList.add('done');
    setTimeout(() => { $('copy').textContent = '📋 複製企劃卡'; $('copy').classList.remove('done'); }, 1800); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, () => fallback(t, ok));
  else fallback(t, ok);
}
function fallback(t, ok) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); ok(); }
function loadMsg(t, err) { $('lmsg').textContent = t; $('lmsg').className = 'msg' + (err ? ' err' : ''); }
function setMsg(t, err) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }

async function pickGroup(g) {
  group = g;
  $('step1').hidden = true; $('form').hidden = false; $('gtag').textContent = '第 ' + g + ' 組';
  setMsg(''); loadMsg(''); window.scrollTo(0, 0);
  fillForm(loadDraft(g));
  if (!API_URL) { loadMsg('（尚未連上雲端，內容只存在這台裝置）'); return; }
  loadMsg('讀取第 ' + g + ' 組…');
  try {
    const r = await (await fetch(API_URL + '?action=get&group=' + g)).json();
    if (group !== g) return;
    if (r.ok && r.card) { fillForm(r.card); saveDraft(); loadMsg('已載入第 ' + g + ' 組（' + r.card.updated + ' 存的）'); }
    else loadMsg('第 ' + g + ' 組還沒存過');
  } catch (e) { loadMsg('讀取失敗，先用這台裝置的草稿', true); }
}

async function save() {
  const d = readForm();
  saveDraft();
  if (!API_URL) { setMsg('已存在這台裝置（尚未連上雲端）'); showResult(d); return; }
  $('save').disabled = true; setMsg('儲存中…');
  try {
    const r = await (await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) })).json();
    if (r.ok) { setMsg('✅ 已儲存（' + r.card.updated + '）'); showResult(r.card); } else setMsg('儲存失敗：' + r.error, true);
  } catch (e) { setMsg('儲存失敗，請再按一次', true); }
  $('save').disabled = false;
}

for (let g = 1; g <= 10; g++) {
  const b = document.createElement('button'); b.textContent = '第 ' + g + ' 組'; b.dataset.g = g; b.onclick = () => pickGroup(g); $('groups').appendChild(b);
}
FIELDS.forEach(k => $(k).addEventListener('input', saveDraft));
$('save').onclick = save;
$('copy').onclick = copyCard;
$('back').onclick = () => { group = 0; $('form').hidden = true; $('step1').hidden = false; window.scrollTo(0, 0); };
</script>
</body>
</html>
